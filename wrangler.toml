name = "vgl-studio"
compatibility_date = "2026-09-12"

# worker.js only forwards www.vglstudio.ai -> vglstudio.ai,
# then hands every request to the static files (same behavior as before).
main = "worker.js"

[assets]
directory = "./"
binding = "ASSETS"
run_worker_first = true
not_found_handling = "404-page"
